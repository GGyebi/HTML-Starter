      <style>
  .subscribe-button {
    background-color:rgb(178, 20, 20);
    color:white;
    border-radius: 2px;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 20px;
    padding-right: 20px;
    vertical-align:center;
    cursor: pointer;
    border:none;
    margin-right: 20px;
    font-size: 15px;
    transition: opacity 0.2s;
  }

  .subscribe-button:hover{
    opacity: 0.8;
  }

  .subscribe-button:active{
    opacity:0.5;
  }

  .join-button {
    background-color:rgb(255, 255, 255);
    color:rgb(12, 92, 219);
    border-radius: 3px;
    padding-top: 9px;
    padding-bottom: 9px;
    padding-left: 20px;
    padding-right: 20px;
    cursor: pointer;
    border-color:rgb(12, 92, 219);
    border-width: 1px;
    border-style: solid;
    margin-right: 20px;
    vertical-align:center;
    font-size: 15px;
    transition: background-color 0.2s, color 0.2s;
  }

  .join-button:hover{
    background-color:rgb(12, 92, 219);
    color: white;
  }

  .join-button:active{
    opacity:0.5;
  }

  .tweet-button {
    background-color:rgb(8, 144, 255);
    color: rgb(255, 255, 255);
    border-radius: 25px;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: 20px;
    vertical-align: center;
    padding-right: 20px;
    cursor:pointer;
    border:none;
    font-weight: bold;
    font-size: 15px;
    margin-right: 20px;
    transition: box-shadow 0.2s;
    }

  .tweet-button:hover{
    box-shadow: 3px 5px 5px rgba(0,0,0,0.15);
  }

</style>
