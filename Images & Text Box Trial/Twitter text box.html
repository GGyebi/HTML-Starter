<!DOCTYPE html>
<html>
  <head>
    <title>Twitter text box</title>
    <style>
      .profile-pic{
        width:50px;
        height:50px;
        vertical-align: middle;
        object-fit: cover;
        border:none;
        border-radius:25px;
      }
      .text-box{
        font-size:19px;
        vertical-align: middle;
        border:none;
        padding-left:10px;
        padding-right:10px;
        padding-top:15px;
        padding-bottom:15px;
      }
      button{
        background-color: rgb(81, 81, 234);
        color:white;
        border:none;
        border-radius: 20px;
        padding-top:10px;
        padding-bottom:10px;
        padding-left:15px;
        padding-right:15px;
        vertical-align: middle;
        font-size: 16px;
        font-weight:bold;
        cursor:pointer;
      }
    </style>
  </head>
  <body>
    <img class="profile-pic" src="thumbnail.avif">
    <input type="text" class="text-box" placeholder="What's happening?">
    <button>Tweet</button>
  </body>
</html>
